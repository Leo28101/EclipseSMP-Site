name: Compiler EclipseLink (.jar)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minecraft-plugin-source/**'
      - '.github/workflows/eclipse-link.yml'

permissions:
  contents: read

jobs:
  build:
    name: EclipseLink Paper 1.21.11
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: minecraft-plugin-source/pom.xml
      - name: Compiler le plugin avec Maven
        run: mvn -B -ntp -f minecraft-plugin-source/pom.xml clean package
      - name: Verifier le fichier jar
        run: test -s minecraft-plugin-source/target/EclipseLink-1.0.0.jar
      - name: Fournir le plugin a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: EclipseLink-Paper-1.21.11
          path: minecraft-plugin-source/target/EclipseLink-1.0.0.jar
          if-no-files-found: error
